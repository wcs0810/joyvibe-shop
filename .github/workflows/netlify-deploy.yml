name: Deploy to Netlify

# push 到 main 后：在 GitHub runner 上构建，再用 Netlify CLI 直接发布产物。
# 该模式不消耗 Netlify 云端构建额度；redirects/headers/functions 仍以 joyvibe-web/netlify.toml 为准。
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

# 连续推送共享部署队列，先入队先发布，避免线上版本被跳过
concurrency:
  group: netlify-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: joyvibe-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 版本注入插件需要读取 git 提交信息

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: joyvibe-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check & build
        run: npm run build

      - name: Deploy to Netlify (production)
        id: deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          set -euo pipefail
          npx --yes netlify-cli deploy \
            --site "$NETLIFY_SITE_ID" \
            --auth "$NETLIFY_AUTH_TOKEN" \
            --prod --no-build \
            --dir=dist \
            --message "GitHub Actions ${GITHUB_SHA}"

      - name: Smoke test live site
        run: |
          set -euo pipefail
          sleep 5
          echo "== 首页 =="
          curl -fsS https://joyvibe-shop.netlify.app/ -o /dev/null
          echo "== SPA 深链 /service =="
          curl -fsS https://joyvibe-shop.netlify.app/service -o /dev/null
          echo "== 同域 API /api/health =="
          curl -fsS https://joyvibe-shop.netlify.app/api/health | tee /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json
          echo "线上冒烟测试全部通过"
