# Render Blueprint — 部署后在 Render 控制台填入环境变量 CORS_ORIGIN
# （前端域名，如 https://joyvibe.vercel.app），多个用逗号分隔。
services:
  - type: web
    name: joyvibe-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: 20
